<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>탐구보고서 작성 프로그램</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--sub:#5d6678;--line:#dfe4ee;--pri:#2f5bea;--pri-d:#2447bd;--pri-l:#e8eefe;--ok:#17803d;--okl:#e3f5ea;--warn:#b45309;--warnl:#fdf1dc;--bad:#c62828;--badl:#fde8e8;--r:12px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:-.3px}
.brand small{font-weight:400;color:var(--sub);margin-left:6px}
.who{margin-left:auto;font-size:13px;color:var(--sub);display:flex;gap:10px;align-items:center}
.steps{max-width:980px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto}
.step{flex:1;min-width:84px;padding:7px 6px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12.5px;text-align:center;cursor:pointer;color:var(--sub);white-space:nowrap}
.step b{display:block;font-size:11px;font-weight:500;opacity:.8}
.step.on{background:var(--pri);border-color:var(--pri);color:#fff}
.step.done{background:var(--pri-l);border-color:#c7d5fb;color:var(--pri-d)}
main{max-width:980px;margin:0 auto;padding:18px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:19px;letter-spacing:-.3px}
.card h3{margin:18px 0 6px;font-size:15.5px}
.desc{color:var(--sub);font-size:13.5px;margin:0 0 14px}
label.l{display:block;font-weight:500;font-size:13.5px;margin:12px 0 4px}
input[type=text],input[type=password],input[type=number],input[type=email],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
textarea{resize:vertical;min-height:110px}
textarea.big{min-height:220px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{background:#f1f3f9}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:#f0c4c4}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.cnt{font-size:12px;color:var(--sub);text-align:right;margin-top:2px}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:20}
.foot-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.foot .sp{flex:1}.stamp{font-size:12px;color:var(--sub)}
.hint{border:1px dashed #b9c8f6;background:#f7f9ff;border-radius:var(--r);padding:16px;margin-top:6px}
.hint h3{margin:0 0 6px;font-size:14.5px;color:var(--pri-d)}
.qa{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.qa .q{font-weight:500}.qa .a{margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}
.a a{color:var(--pri);word-break:break-all}
.chat{height:380px;overflow-y:auto;background:#f8f9fd;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:9px 13px;border-radius:14px;font-size:14.5px;word-break:break-word}
.msg.u{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg a{color:inherit;text-decoration:underline;word-break:break-all}
.rec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.rec-grid{grid-template-columns:1fr}}
.rec{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:8px}
.rec .tag{align-self:flex-start;font-size:12px;padding:2px 9px;border-radius:99px;font-weight:700}
.t-b{background:var(--okl);color:var(--ok)}.t-m{background:var(--warnl);color:var(--warn)}.t-a{background:var(--badl);color:var(--bad)}
.rec .tt{font-weight:700}.rec .why{font-size:13px;color:var(--sub);flex:1}
.fb{margin-top:8px;background:var(--warnl);border:1px solid #f1d9a8;border-radius:8px;padding:10px 12px;font-size:14px}
.fb b{color:var(--warn)}
.chip{display:inline-block;margin:3px 6px 3px 0;padding:6px 12px;border:1px solid #c7d5fb;background:var(--pri-l);color:var(--pri-d);border-radius:99px;cursor:pointer;font-size:13px}
.sub{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:start;margin-bottom:10px}
.sub .n{width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:4px}
.imgs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.img{width:170px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff}
.img img{width:100%;height:110px;object-fit:cover;border-radius:5px;display:block}
.img input{margin-top:5px;padding:5px 7px;font-size:12px}
.plag{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
.bar{height:12px;background:#eceff6;border-radius:99px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%}
.pct{font-size:30px;font-weight:700}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.b-ok{background:var(--okl);color:var(--ok)}.b-warn{background:var(--warnl);color:var(--warn)}.b-bad{background:var(--badl);color:var(--bad)}.b-gray{background:#eceff6;color:var(--sub)}
.match{font-size:13px;border-left:3px solid var(--line);padding:4px 10px;margin:6px 0;background:#fafbfe}
.note{font-size:12.5px;color:var(--sub);background:#f4f6fb;border-radius:8px;padding:8px 10px;margin-top:8px}
.center{max-width:480px;margin:30px auto}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:92vw}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #cfd6e8;border-top-color:var(--pri);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{background:#f4f6fb;font-size:12.5px;color:var(--sub);position:sticky;top:0}
.scroll{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:8px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(20,26,40,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px}
.modal-in{background:#fff;border-radius:14px;max-width:860px;width:100%;padding:20px}
.warnbox{background:var(--warnl);border:1px solid #f1d9a8;border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.link{color:var(--pri);cursor:pointer;text-decoration:underline;font-size:13px;background:none;border:0;padding:0}
.hide{display:none!important}
#pdfhost{position:fixed;left:-12000px;top:0;width:794px;background:#fff}
</style>
</head>
<body>
<div id="root"></div>
<div id="pdfhost"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
/* ============ 설정: 본인의 Firebase 프로젝트 값으로 교체 ============ */
const firebaseConfig = {
  apiKey: "AIzaSyC-xCX89iTk0hmJIhkf6PUEQqc3bL1gSGg",
  authDomain: "form-27bde.firebaseapp.com",
  projectId: "form-27bde",
  storageBucket: "form-27bde.firebasestorage.app",
  messagingSenderId: "196082259266",
  appId: "1:196082259266:web:2fd4ff86db99516fa2e4db"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
/* ===================================================================== */

let auth = null, db = null;
if (CONFIGURED) {
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();
}

/* ---------- 유틸 ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').replace(/\s+/g, '').toLowerCase();
const digits = s => String(s || '').replace(/\D/g, '');
const ck = (school, grade, cls) => [norm(school), digits(grade), digits(cls) || norm(cls)].join('|');
const rnd = (n = 10) => Array.from(crypto.getRandomValues(new Uint8Array(n))).map(b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join('');
const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const setPath = (o, p, v) => { const ks = p.split('.'); let c = o; ks.slice(0, -1).forEach(k => { if (c[k] == null || typeof c[k] !== 'object') c[k] = {}; c = c[k]; }); c[ks[ks.length - 1]] = v; };
const len = s => [...String(s || '')].length;
const pad = n => String(n).padStart(2, '0');
const hhmm = t => t ? `${pad(new Date(t).getHours())}:${pad(new Date(t).getMinutes())}` : '-';
const fmtDate = t => { if (!t) return '-'; const d = t.toDate ? t.toDate() : new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

async function sha256(s) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { // 비보안 컨텍스트 대비 단순 해시
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
    return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0') + s.length.toString(16);
  }
}

function md(s) {
  let h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  h = h.replace(/(https?:\/\/[^\s<)\]]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  return h.replace(/\n/g, '<br>');
}
let toastT;
function toast(m, ms = 2600) {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), ms);
}
function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.old = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${label || '처리 중...'}`; }
  else { btn.disabled = false; btn.innerHTML = btn.dataset.old || btn.innerHTML; }
}
function parseJSON(t) {
  const s = t.search(/[\[{]/); if (s < 0) throw new Error('AI 응답을 해석하지 못했습니다.');
  const open = t[s], close = open === '{' ? '}' : ']'; const e = t.lastIndexOf(close);
  return JSON.parse(t.slice(s, e + 1));
}

/* ---------- 로컬 임시저장 (IndexedDB) ---------- */
const idb = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (this.db) return res(this.db);
      const r = indexedDB.open('autoreport2', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('drafts');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) { const d = await this.open(); return new Promise((res, rej) => { const q = d.transaction('drafts').objectStore('drafts').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const d = await this.open(); return new Promise((res, rej) => { const q = d.transaction('drafts', 'readwrite').objectStore('drafts').put(v, k); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); }
};

/* ---------- 인증 / AI ---------- */
async function ensureAuth() { if (!auth.currentUser) await auth.signInAnonymously(); return auth.currentUser; }
const AI = { key: '', model: DEFAULT_MODEL, loaded: false };
async function loadAI(force) {
  if (AI.loaded && !force) return;
  await ensureAuth();
  try { const s = await db.collection('config').doc('ai').get(); if (s.exists) { AI.key = s.data().key || ''; AI.model = s.data().model || DEFAULT_MODEL; } } catch (e) { console.warn(e); }
  AI.loaded = true;
}
async function claude({ system, messages, search = false, max = 1500 }) {
  await loadAI();
  if (!AI.key) throw new Error('AI 키가 설정되어 있지 않습니다. 관리자에게 문의하세요.');
  const body = { model: AI.model || DEFAULT_MODEL, max_tokens: max, system, messages };
  if (search) body.tools = [{ type: 'web_search_20250305', name: 'web_search', max_uses: 3 }];
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': AI.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify(body)
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error?.message || ('AI 호출 실패 ' + r.status));
  return (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
}

/* ---------- 상태 ---------- */
const PAGES = ['기본정보', '대주제', '하위질문', '서론', '본론', '결론', '자기평가'];
const FIELDS = ['인문계열', '사회계열', '자연계열', '공학계열', '의약계열', '교육계열', '예체능계열', '기타/미정'];
function emptyData() {
  return {
    meta: { page: 2 },
    p2: { interest: '', major: '', field: '', subjectQ: '', issue: '', chat: [], recs: null, topic: '' },
    p3: { subs: [{ title: '', q: '' }, { title: '', q: '' }, { title: '', q: '' }] },
    p4: { motive: '', purpose: '', need: '' },
    p5: { items: [] },
    p6: { summary: '', hard: '', learned: '', felt: '', link: '' },
    p7: { motive: '', process: '', result: '', felt: '', next: '' },
    hints: {}, fb: {}, plag: {}
  };
}
function mergeData(d) { const e = emptyData(); const m = (a, b) => { for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) m(a[k], b[k]); else a[k] = b[k]; } return a; }; return m(e, d || {}); }

let S = null;      // 학생 세션
let view = 'student';

function topic() { return S?.data.p2.topic || ''; }

/* ---------- 바인딩 ---------- */
document.addEventListener('input', e => {
  const el = e.target; const p = el.dataset?.b; if (!p) return;
  const inModal = !!el.closest('#modal');
  const tgt = inModal ? E.doc : S.data;
  const v = el.type === 'number' ? el.value : el.value;
  setPath(tgt, p, v);
  const c = (el.closest('#modal') || document).querySelector(`[data-c="${p}"]`); if (c) c.textContent = len(v) + '자';
  if (inModal) E.dirty = true; else if (S) S.dirty = true;
});
window.addEventListener('beforeunload', e => { if (S && S.dirty) { e.preventDefault(); e.returnValue = ''; } });

function ta(path, label, ph, cls = '') {
  const v = getPath(S.data, path) || '';
  return `<label class="l">${label}</label><textarea class="${cls}" data-b="${path}" placeholder="${esc(ph || '')}">${esc(v)}</textarea><div class="cnt" data-c="${path}">${len(v)}자</div>`;
}
function inp(path, label, ph) {
  const v = getPath(S.data, path) || '';
  return `<label class="l">${label}</label><input type="text" data-b="${path}" value="${esc(v)}" placeholder="${esc(ph || '')}">`;
}

/* ---------- 렌더 ---------- */
function render() {
  const root = $('#root');
  if (view === 'admin' || view === 'teacher') return renderStaff(root);
  if (!CONFIGURED) { root.innerHTML = `<main><div class="card center"><h2>Firebase 설정이 필요합니다</h2><p class="desc">파일 상단의 <b>FIREBASE_CONFIG</b>에 본인 Firebase 프로젝트 값을 넣어주세요. 자세한 순서는 설치안내 문서를 참고하세요.</p></div></main>`; return; }
  if (!S) return renderLogin(root);
  const pg = S.page;
  const who = `${esc(S.ident.name)} · ${esc(S.ident.school)} ${esc(S.ident.grade)}학년 ${esc(S.ident.cls)}반 ${esc(S.ident.num)}번`;
  const steps = PAGES.map((n, i) => {
    const no = i + 1; const cls = no === pg ? 'on' : (no < pg ? 'done' : '');
    return `<div class="step ${cls}" onclick="go(${no})"><b>${no}</b>${n}</div>`;
  }).join('');
  const fn = { 2: p2, 3: p3, 4: p4, 5: p5, 6: p6, 7: p7 }[pg];
  root.innerHTML = `
  <div class="top"><div class="top-in"><div class="brand">탐구보고서<small>작성 프로그램</small></div>
  <div class="who"><span>${who}</span><button class="btn sm" onclick="logout()">나가기</button></div></div>
  <div class="steps">${steps}</div></div>
  <main>${fn()}</main>
  <div class="foot"><div class="foot-in">
    <button class="btn" onclick="saveDraft(true)">임시저장 (이 기기)</button>
    <button class="btn pri" id="btnSave" onclick="saveCloud()">저장 (온라인)</button>
    <span class="stamp" id="stamp">${stampText()}</span><span class="sp"></span>
    <button class="btn" onclick="go(${pg - 1})" ${pg <= 2 ? 'disabled' : ''}>이전</button>
    <button class="btn" onclick="go(${pg + 1})" ${pg >= 7 ? 'disabled' : ''}>다음</button>
  </div></div>`;
  window.scrollTo(0, 0);
  if (pg === 2) scrollChat();
}
function stampText() { return `임시저장 ${hhmm(S.draftAt)} · 온라인 저장 ${hhmm(S.savedAt)}${S.dirty ? ' · 저장 안 된 변경 있음' : ''}`; }
function stampUpdate() { const s = $('#stamp'); if (s) s.textContent = stampText(); }

/* ---------- 1. 로그인 ---------- */
async function renderLogin(root) {
  root.innerHTML = `<main><div class="card center"><h2>탐구보고서 작성 시작</h2>
  <p class="desc">아래 정보로 내 작성 내용이 온라인에 저장됩니다. 다음에 같은 정보를 입력하면 이어서 쓸 수 있어요.</p>
  <label class="l">이름</label><input type="text" id="l_name" autocomplete="off">
  <label class="l">학교</label><input type="text" id="l_school" list="schools" placeholder="예) 원주고등학교" autocomplete="off"><datalist id="schools"></datalist>
  <div class="row"><div><label class="l">학년</label><select id="l_grade"><option>1</option><option>2</option><option>3</option></select></div>

async function doLogin() {
  const name = $('#l_name').value.trim(), school = $('#l_school').value.trim(), grade = $('#l_grade').value, cls = digits($('#l_cls').value), num = digits($('#l_num').value), birth = $('#l_birth').value.trim();

  try {

    }

    if (dr && dr.ts > (S.savedAt || 0) && confirm(`이 기기에 ${fmtDate(dr.ts)}에 임시저장한 더 최신 내용이 있습니다. 불러올까요?`)) {
      S.data = mergeData(dr.data); S.imgs = Object.assign(S.imgs, dr.imgs || {}); S.pending = Object.assign({}, dr.imgs || {}); S.removed = dr.removed || []; S.dirty = true; S.draftAt = dr.ts;
    }

async function saveDraft(show) {
  if (!S) return;

  try {
    S.draftAt = Date.now();

    stampUpdate(); if (show) toast('이 기기에 임시저장했어요.');
  } catch (e) { if (show) toast('임시저장 실패: ' + e.message); }
}
function allText(scope) {
  const d = S?.data || E?.doc?.data;
  const join = a => a.filter(Boolean).join('\n');
  if (scope === 'body') return join(d.p5.items.map(i => i.text));
  return join([d.p4.motive, d.p4.purpose, d.p4.need, ...d.p5.items.map(i => i.text), d.p6.hard, d.p6.learned, d.p6.felt, d.p6.link, d.p7.motive, d.p7.process, d.p7.result, d.p7.felt, d.p7.next]);
}
async function saveCloud(silent, statusOverride) {
  if (!S) return;
  const btn = $('#btnSave'); if (!silent) busy(btn, true, '저장 중...');
  try {
    await ensureAuth();
    S.data.meta.page = S.page;
    const ref = db.collection('students').doc(S.id);
    for (const id of Object.keys(S.pending)) { await ref.collection('images').doc(id).set({ dataUrl: S.imgs[id] || S.pending[id], createdAt: Date.now() }); delete S.pending[id]; }
    for (const id of S.removed) { await ref.collection('images').doc(id).delete().catch(() => { }); }
    S.removed = [];
    const status = statusOverride || S.status || 'draft';
    const base = { name: S.ident.name, school: S.ident.school, grade: S.ident.grade, cls: S.ident.cls, num: S.ident.num, classKey: ck(S.ident.school, S.ident.grade, S.ident.cls), schoolKey: norm(S.ident.school), status, topic: S.data.p2.topic || '', plagTotal: S.data.plag?.p7?.total ?? S.data.plag?.p5?.total ?? null, data: S.data, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
    if (!S.exists) base.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    await ref.set(base, { merge: true }); S.exists = true;
    await saveFingerprint(S.id, S.ident, S.data);
    S.savedAt = Date.now(); S.dirty = false;
    await idb.set(S.id, { data: JSON.parse(JSON.stringify(S.data)), imgs: {}, removed: [], ts: S.savedAt }).catch(() => { });
    S.draftAt = S.savedAt;
    stampUpdate(); if (!silent) toast('온라인에 저장했어요.');
  } catch (e) { console.error(e); toast('저장 실패: ' + e.message, 5000); }
  finally { if (!silent) busy(btn, false); }
}

- 학생의 관심사·관심 학과·계열, 교과에서 궁금한 점, 교과 내용을 확장한 궁금증을 차근차근 묻는다.
- 학생이 사회 이슈를 모르거나 요청하면 웹검색으로 최근 이슈를 2~3개 쉽게 소개하고 출처 URL을 적는다.
- 아직 주제를 직접 정해 주지 않는다. 학생 답에서 키워드를 뽑아 연결해 주고, 정보가 충분해지면 '주제 추천받기' 버튼을 눌러 보라고 안내한다.`;
function infoText() { const d = S.data.p2; return `관심사: ${d.interest || '-'}\n관심 학과: ${d.major || '-'}\n관심 계열: ${d.field || '-'}\n교과에서 궁금한 점: ${d.subjectQ || '-'}\n사회 이슈: ${d.issue || '-'}`; }
async function startChat() {

function sendChatFromInput() { const i = $('#chatIn'); const t = i.value.trim(); if (!t) return; i.value = ''; sendChat(t, $('#btnChat')); }
async function sendChat(text, btn) {
  const d = S.data.p2; d.chat.push({ role: 'user', content: text }); S.dirty = true; $('#chat').innerHTML = chatHTML(); scrollChat();
  busy(btn, true, '생각 중...');

  finally { busy(btn, false); $('#chat').innerHTML = chatHTML(); scrollChat(); }
}

async function addImgs(i, input) {
  const it = S.data.p5.items[i];
  for (const f of input.files) {
    if (it.images.length >= 6) { toast('소주제당 이미지는 최대 6장까지예요.'); break; }
    try {
      const url = await compressImg(f); const id = rnd(12);
      S.imgs[id] = url; S.pending[id] = url; it.images.push({ id, caption: '' }); S.dirty = true;
    } catch (e) { toast('이미지를 불러오지 못했어요.'); }
  }
  input.value = ''; $('#imgs-' + i).innerHTML = imgsHTML(i);
}
function compressImg(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => { const M = 1000; let w = im.width, h = im.height; const k = Math.min(1, M / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k); const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(im, 0, 0, w, h); res(c.toDataURL('image/jpeg', .72)); }; im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
function delImg(i, j) {
  const m = S.data.p5.items[i].images.splice(j, 1)[0];
  if (S.pending[m.id]) delete S.pending[m.id]; else S.removed.push(m.id);
  delete S.imgs[m.id]; S.dirty = true; $('#imgs-' + i).innerHTML = imgsHTML(i);
}

/* ================= AI 표절 검수 ================= */
function textOf(d, scope) {
  const j = a => a.filter(Boolean).join('\n');
  if (scope === 'body') return j(d.p5.items.map(i => i.text));

function fnv(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

async function saveFingerprint(id, ident, data) {

async function crossCheck(scope) {

  const snap = await db.collection('fingerprints').where('schoolKey', '==', norm(S.ident.school)).limit(600).get();

async function webCheck(text) {

전체 글 중 웹 문서와 거의 같은 문장이 차지하는 비율을 percent(0~100 정수)로 추정한다. 일반 상식, 용어 정의, 인용 표시된 부분은 표절로 보지 않는다. 확인된 근거가 없으면 높은 수치를 주지 않는다.
검색을 마친 뒤 마지막에 JSON만 출력한다: {"percent":0,"matches":[{"excerpt":"학생 글 일부 60자 이내","url":"","note":"한 줄 설명"}]}`;

}

function openStaff(role) { view = role; ST = { role, tab: 'reports', list: [], sel: new Set(), codes: [], mine: [], cur: null, f: {}, ok: false }; location.hash = role; render(); }
function leaveStaff() { view = 'student'; ST.ok = false; history.replaceState(null, '', location.pathname); render(); }

function renderStaff(root) {
  if (!CONFIGURED) { root.innerHTML = '<main><div class="card center"><h2>Firebase 설정이 필요합니다</h2></div></main>'; return; }
  const title = ST.role === 'admin' ? '관리자 모드' : '강사 모드';

async function adminLogin() {
  const btn = $('#btnAL'); busy(btn, true, '확인 중...');

/* ---------- 보고서 목록 (공통) ---------- */

function readF() { const g = id => ($('#' + id)?.value || '').trim(); ST.f = { school: g('f_school'), grade: g('f_grade'), cls: g('f_cls'), name: g('f_name'), from: g('f_from'), to: g('f_to'), status: g('f_status') }; }
function visible() {

  return ST.list.filter(x => (!f.school || norm(x.school) === norm(f.school)) && (!f.grade || String(x.grade) === f.grade) && (!f.cls || digits(x.cls) === digits(f.cls)) && (!f.name || (x.name || '').includes(f.name)) && (!f.status || x.status === f.status) && (!f.from || ts(x) >= new Date(f.from + 'T00:00:00').getTime()) && (!f.to || ts(x) <= new Date(f.to + 'T23:59:59').getTime()));

function applyFilters() { readF(); $('#tbl').innerHTML = tableHTML(); }
function tableHTML() {

  ${v.map(x => `<tr><td><input type="checkbox" ${ST.sel.has(x.id) ? 'checked' : ''} onchange="selOne('${x.id}',this.checked)"></td><td>${esc(x.name)}</td><td>${esc(x.school)}</td><td>${esc(x.grade)}</td><td>${esc(x.cls)}</td><td>${esc(x.num)}</td>

}
function selAll(on) { visible().forEach(x => on ? ST.sel.add(x.id) : ST.sel.delete(x.id)); $('#tbl').innerHTML = tableHTML(); }
function selOne(id, on) { on ? ST.sel.add(id) : ST.sel.delete(id); }
function selDocs() { return ST.list.filter(x => ST.sel.has(x.id)); }
function pdfSel(m) { downloadPDF(selDocs(), m); }
async function procSel(m) {
  const ds = selDocs(); if (!ds.length) return toast('학생을 선택해 주세요.');

async function procOne(id) { const ds = ST.list.filter(x => x.id === id); try { await ensureProcess(ds); await downloadPDF(ds, false, 'process'); } catch (e) { } }
function pdfOne(id) { downloadPDF(ST.list.filter(x => x.id === id), false); }
async function delSel() {
  const ds = selDocs(); if (!ds.length) return toast('삭제할 학생을 선택해 주세요.');
  if (!confirm(`선택한 ${ds.length}명의 보고서를 완전히 삭제할까요? 되돌릴 수 없습니다.`)) return;
  try {
    for (const x of ds) { const r = db.collection('students').doc(x.id); (await r.collection('images').get()).forEach(d => d.ref.delete()); await r.delete(); await db.collection('fingerprints').doc(x.id).delete().catch(() => { }); }
    ST.list = ST.list.filter(x => !ST.sel.has(x.id)); ST.sel.clear(); $('#tbl').innerHTML = tableHTML(); toast('삭제했어요.');

function drawReports() { $('#staffBody').innerHTML = filterBar() + `<div class="card" id="tbl">${tableHTML()}</div>`; }
async function searchStudents() {
  readF(); const f = ST.f; let q = db.collection('students');
  const server = f.school || f.grade || f.cls || f.name;
  try {
    if (f.school) q = q.where('schoolKey', '==', norm(f.school));
    if (f.grade) q = q.where('grade', '==', f.grade);
    if (f.cls) q = q.where('cls', '==', digits(f.cls));
    if (f.name) q = q.where('name', '==', f.name);
    if (!server) q = q.orderBy('updatedAt', 'desc');
    const snap = await q.limit(server ? 800 : 300).get();
    ST.list = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.updatedAt?.toMillis?.() || 0) - (a.updatedAt?.toMillis?.() || 0));
    ST.sel.clear(); $('#staffBody').innerHTML = filterBar() + `<div class="card" id="tbl">${tableHTML()}</div>`;
  } catch (e) { toast('불러오기 실패: ' + e.message, 5000); }
}

/* ---------- 강사 코드 (관리자) ---------- */
const CODE_CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode() { return Array.from(crypto.getRandomValues(new Uint8Array(8))).map(b => CODE_CH[b % CODE_CH.length]).join(''); }
function parseClasses(s) {
  const out = new Set(); String(s).split(/[,\s]+/).filter(Boolean).forEach(p => { const m = p.match(/^(\d+)-(\d+)$/); if (m) { for (let i = +m[1]; i <= +m[2] && i < 60; i++) out.add(String(i)); } else if (/^\d+$/.test(p)) out.add(p); }); return [...out];
}
async function drawCodes() {
  $('#staffBody').innerHTML = `<div class="card"><h2>강사 코드 만들기</h2><p class="desc">학교·학년·반별로 코드를 만들어 강사에게 전달하세요. 강사가 강사 모드에서 코드를 입력하면 해당 반의 보고서를 보고 수정할 수 있습니다.</p>
  <div class="row"><div><label class="l">학교</label><input type="text" id="c_school" placeholder="예) 원주고등학교"></div><div><label class="l">학년</label><select id="c_grade"><option>1</option><option>2</option><option>3</option></select></div>
  <div><label class="l">반 (쉼표·범위 가능)</label><input type="text" id="c_cls" placeholder="예) 1,2,3 또는 1-5"></div><div><label class="l">강사 이름(메모)</label><input type="text" id="c_label"></div></div>
  <button class="btn pri" style="margin-top:12px" onclick="makeCodes()">코드 만들기</button></div><div class="card"><h3 style="margin-top:0">발급한 코드</h3><div id="codeList"><span class="spin"></span>불러오는 중...</div></div>`;
  loadCodes();
}
async function loadCodes() {
  try {
    const s = await db.collection('classCodes').orderBy('createdAt', 'desc').limit(500).get(); ST.codes = s.docs.map(d => ({ id: d.id, ...d.data() }));
    $('#codeList').innerHTML = `<div class="scroll"><table class="t"><thead><tr><th>코드</th><th>학교</th><th>학년</th><th>반</th><th>강사</th><th>상태</th><th></th></tr></thead><tbody>${ST.codes.map(c => `<tr><td><b style="letter-spacing:1px">${c.id}</b></td><td>${esc(c.school)}</td><td>${esc(c.grade)}</td><td>${esc(c.cls)}</td><td>${esc(c.label || '')}</td><td><span class="badge ${c.active ? 'b-ok' : 'b-bad'}">${c.active ? '사용 중' : '중지'}</span></td>
    <td style="white-space:nowrap"><button class="btn sm" onclick="copyCode('${c.id}')">복사</button> <button class="btn sm" onclick="toggleCode('${c.id}',${!c.active})">${c.active ? '중지' : '재개'}</button> <button class="btn sm bad" onclick="delCode('${c.id}')">삭제</button></td></tr>`).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--sub);padding:20px">발급한 코드가 없습니다.</td></tr>'}</tbody></table></div>`;
  } catch (e) { $('#codeList').textContent = '불러오기 실패: ' + e.message; }
}
async function makeCodes() {
  const school = $('#c_school').value.trim(), grade = $('#c_grade').value, label = $('#c_label').value.trim(), cl = parseClasses($('#c_cls').value);
  if (!school || !cl.length) return toast('학교와 반을 입력해 주세요.');
  try {
    const b = db.batch();
    cl.forEach(c => b.set(db.collection('classCodes').doc(newCode()), { school, grade, cls: c, classKey: ck(school, grade, c), label, active: true, createdAt: Date.now() }));
    b.set(db.collection('config').doc('public'), { schools: firebase.firestore.FieldValue.arrayUnion(school) }, { merge: true });
    await b.commit(); toast(`${cl.length}개 코드를 만들었어요.`); loadCodes();
  } catch (e) { toast('실패: ' + e.message, 5000); }
}
function copyCode(c) { const x = ST.codes.find(k => k.id === c); const t = `${x.school} ${x.grade}학년 ${x.cls}반 강사 코드: ${c}`; navigator.clipboard?.writeText(t).then(() => toast('복사했어요: ' + t)); }
async function toggleCode(id, on) { await db.collection('classCodes').doc(id).update({ active: on }); loadCodes(); }
async function delCode(id) { if (!confirm('이 코드를 삭제할까요? 이 코드로 접속한 강사의 권한이 사라집니다.')) return; await db.collection('classCodes').doc(id).delete(); loadCodes(); }

async function drawTeacher() {
  const b = $('#staffBody'); b.innerHTML = '<div class="card"><span class="spin"></span>접속 중...</div>';
  try { await ensureAuth(); } catch (e) { b.innerHTML = '<div class="card">접속 실패: ' + esc(e.message) + '</div>'; return; }

async function addCode() {
  const code = $('#t_code').value.trim().toUpperCase(); if (code.length < 6) return toast('코드를 입력해 주세요.');

    const c = s.data(); await db.collection('instructors').doc(auth.currentUser.uid + '_' + c.classKey).set({ uid: auth.currentUser.uid, code, school: c.school, grade: c.grade, cls: c.cls, classKey: c.classKey, label: c.label || '', createdAt: Date.now() });
    ST.cur = c.classKey; toast(`${c.school} ${c.grade}학년 ${c.cls}반 권한을 받았어요.`); drawTeacher();
  } catch (e) { toast('등록 실패: ' + e.message, 5000); }
}
async function dropClass(id) { if (!confirm('이 반 권한을 해제할까요?')) return; await db.collection('instructors').doc(id).delete(); if (ST.mine.find(c => c.id === id)?.classKey === ST.cur) ST.cur = null; drawTeacher(); }
function pickClass(k) { ST.cur = k; ST.list = []; ST.sel.clear(); drawTeacher(); }
async function loadClass() {
  if (!ST.cur) return; readF();
  try {

/* ---------- 편집 모달 (관리자·강사 공용) ---------- */
async function openEditor(id) {
  const rec = ST.list.find(x => x.id === id); if (!rec) return;
  E = { doc: JSON.parse(JSON.stringify({ ...rec, updatedAt: null })), id, dirty: false, imgs: await fetchImgs(id), removed: [] };
  E.doc.data = mergeData(E.doc.data); E.orig = rec; drawEditor();
}
function ea(path, label, cls, ro) {
  const v = getPath(E.doc, path) || ''; return `<label class="l">${label}</label><textarea class="${cls || ''}" data-b="${path}" ${ro ? 'readonly' : ''}>${esc(v)}</textarea><div class="cnt" data-c="${path}">${len(v)}자</div>`;
}
function ei(path, label, ro) { return `<div><label class="l">${label}</label><input type="text" data-b="${path}" value="${esc(getPath(E.doc, path) || '')}" ${ro ? 'readonly style="background:#f1f3f9"' : ''}></div>`; }
function drawEditor() {
  const d = E.doc.data, t = ST.role === 'teacher';
  $('#modal').className = 'modal'; $('#modal').innerHTML = `<div class="modal-in">
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0;font-size:18px">${esc(E.doc.name)} 학생 보고서 ${t ? '' : '수정'}</h2><span class="sp" style="flex:1"></span>
  <button class="btn pri" onclick="saveEditor()">수정 내용 저장</button><button class="btn" onclick="pdfEditor()">PDF</button><button class="btn" onclick="procEditor(false)">과정요약 PDF</button><button class="btn" onclick="closeEditor()">닫기</button></div>
  <h3>기본 정보</h3><div class="row">${ei('name', '이름')}${ei('school', '학교', t)}${ei('grade', '학년', t)}${ei('cls', '반', t)}${ei('num', '번호')}
  <div><label class="l">상태</label><select data-b="status"><option value="draft" ${E.doc.status !== 'submitted' ? 'selected' : ''}>작성 중</option><option value="submitted" ${E.doc.status === 'submitted' ? 'selected' : ''}>제출 완료</option></select></div></div>
  <h3>대주제</h3>${ea('data.p2.topic', '대주제')}
  <h3>하위 질문</h3>${d.p3.subs.map((s, i) => `<div class="row" style="margin-bottom:6px">${ei(`data.p3.subs.${i}.title`, `소주제 ${i + 1}`)}${ei(`data.p3.subs.${i}.q`, '알고 싶은 것')}</div>`).join('')}
  <h3>서론</h3>${ea('data.p4.motive', '탐구 동기')}${ea('data.p4.purpose', '탐구 목적')}${ea('data.p4.need', '탐구 필요성')}
  <h3>본론</h3>${d.p5.items.map((it, i) => `<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px">${ei(`data.p5.items.${i}.title`, `소주제 ${i + 1} 제목`)}${ea(`data.p5.items.${i}.text`, '내용', 'big')}
  <div class="imgs">${(it.images || []).map((m, j) => `<div class="img"><img src="${E.imgs[m.id] || ''}" alt=""><input type="text" data-b="data.p5.items.${i}.images.${j}.caption" value="${esc(m.caption)}"><button class="btn sm bad" style="width:100%;margin-top:5px" onclick="edDelImg(${i},${j})">삭제</button></div>`).join('')}</div>${ea(`data.p5.items.${i}.refs`, '참고 자료')}</div>`).join('') || '<div class="desc">작성된 본론이 없습니다.</div>'}
  <h3>결론</h3>${ea('data.p6.summary', '결론 요약', 'big')}${ea('data.p6.hard', '어려웠던 점')}${ea('data.p6.learned', '배운 점')}${ea('data.p6.felt', '느낀 점')}${ea('data.p6.link', '이후 연계 주제')}
  <h3>자기평가서</h3>${ea('data.p7.motive', '동기')}${ea('data.p7.process', '과정')}${ea('data.p7.result', '결과')}${ea('data.p7.felt', '느낀 점 · 알게 된 점')}${ea('data.p7.next', '추후 연계 활동')}
  <h3>탐구 과정 요약 (교사용)</h3><div class="desc">학생이 AI에게 한 질문, 대화, 작성 내용을 바탕으로 AI가 정리합니다. 학생에게는 보이지 않습니다. 고친 내용은 &quot;수정 내용 저장&quot;으로 저장하세요.</div>
  <button class="btn ok" id="btnProc" onclick="regenProcess()">${E.doc.processReport ? '다시 작성하기' : 'AI로 작성하기'}</button>
  ${E.doc.processReport ? PSEC.map(([k, t]) => ea('processReport.' + k, t)).join('') : ''}
  ${d.plag?.p7 || d.plag?.p5 ? `<h3>AI 표절 검수 결과</h3>${plagHTML(d.plag.p7 ? 'p7' : 'p5', E.doc.data)}` : ''}</div>`;
  document.body.style.overflow = 'hidden';
}
function edDelImg(i, j) { const m = E.doc.data.p5.items[i].images.splice(j, 1)[0]; E.removed.push(m.id); E.dirty = true; const y = $('#modal').scrollTop; drawEditor(); $('#modal').scrollTop = y; }
function closeEditor() { if (E?.dirty && !confirm('저장하지 않은 수정이 있습니다. 닫을까요?')) return; E = null; $('#modal').className = ''; $('#modal').innerHTML = ''; document.body.style.overflow = ''; }
async function saveEditor() {
  const x = E.doc; const ident = { name: x.name, school: x.school, grade: x.grade, cls: x.cls, num: x.num };
  try {
    const ref = db.collection('students').doc(E.id);
    for (const id of E.removed) await ref.collection('images').doc(id).delete().catch(() => { });
    const upd = { name: x.name, school: x.school, grade: String(x.grade), cls: String(x.cls), num: String(x.num), classKey: ck(x.school, x.grade, x.cls), schoolKey: norm(x.school), status: x.status || 'draft', topic: x.data.p2.topic || '', data: x.data, updatedAt: firebase.firestore.FieldValue.serverTimestamp(), editedBy: ST.role + ':' + (auth.currentUser?.email || auth.currentUser?.uid || ''), editedAt: Date.now() }; if (x.processReport) upd.processReport = x.processReport;
    await ref.update(upd); await saveFingerprint(E.id, ident, x.data);
    Object.assign(E.orig, upd, { updatedAt: { toMillis: () => Date.now(), toDate: () => new Date() } }); E.removed = []; E.dirty = false;
    toast('수정 내용을 저장했어요.'); const t = $('#tbl'); if (t) t.innerHTML = tableHTML();
  } catch (e) { toast('저장 실패: ' + e.message, 5000); }
}
async function regenProcess() {
  if (E.doc.processReport && !confirm('기존 과정 요약을 새로 쓴 내용으로 바꿀까요?')) return;
  const btn = $('#btnProc'); busy(btn, true, '작성 중...');
  try { E.doc.processReport = await genProcess(E.doc); E.dirty = true; const y = $('#modal').scrollTop; drawEditor(); $('#modal').scrollTop = y; toast('작성했어요. 저장 버튼을 눌러야 보관됩니다.'); }
  catch (e) { toast('작성 실패: ' + e.message, 5000); busy(btn, false); }
}
function procEditor() { if (!E.doc.processReport) return toast('먼저 "AI로 작성하기"를 눌러 주세요.'); downloadPDF([{ ...E.doc, updatedAt: E.orig.updatedAt }], false, 'process'); }
function pdfEditor() { downloadPDF([{ ...E.doc, updatedAt: E.orig.updatedAt }], false); }

/* ================= 시작 ================= */
(async function boot() {
  const h = location.hash.replace('#', '');
  if (h === 'admin' || h === 'teacher') { view = h; ST.role = h; }
  render();
  if (view === 'student' && CONFIGURED && await resume()) render();
})();
</script>
</body>
</html>
